[project]
name = "compton-guide"
version = "0.1.0"
description = "Standalone Tkinter GUI front-end for pluggable Compton-scattering physics models (kascade, xigma-i, ...)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pint",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
