[project]
name = "compton-gui"
version = "0.1.0"
description = "Standalone Tkinter GUI front-end for pluggable Compton-scattering physics models (dfe5, xigma-i, ...)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
